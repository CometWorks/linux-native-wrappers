name: Build

# Builds the Linux native wrapper shared libraries and publishes them as
# tar.gz release assets. These PE-loader shims let the original Windows
# Space Engineers native DLLs run on Linux; both Pulsar for Linux and Magnetar
# consume the resulting archives.
#
#   * push to main        -> build, then publish a PUBLIC release tagged
#                            v1.0.<run_number> and marked "latest". All four
#                            tar.gz assets are attached.
#   * non-draft pull request activity
#                          -> build, then publish a DRAFT release (not public,
#                             not "latest", no git tag is created until/unless a
#                             maintainer publishes it). Same assets otherwise.
#   * draft pull requests  -> skipped entirely (no build, no release).
#
# Building, testing and packaging are done by ./build_and_package.sh, the same
# script used for local builds. Local and published archives have the same names
# and layout. It builds and tests the Release and Debug configurations and
# writes four archives under dist/, one per game and configuration:
#
#   * Release (-O3 -DNDEBUG) -> se1-native-wrappers.tar.gz         (primary)
#                               se2-native-wrappers.tar.gz         (primary)
#   * Debug   (-O0 -g)       -> se1-native-wrappers.debug.tar.gz
#                               se2-native-wrappers.debug.tar.gz
#
# The wrappers are split per game, so a consumer only downloads the libraries
# its own game version loads. All four are attached to the same release;
# consumers pull the release asset by name. This layout replaced the single
# combined linux-native-wrappers archive, which is no longer published.
#
# The build toolchain (ubuntu 24.04 + build-essential/cmake/make/g++) is
# identical to the Docker-based build that Magnetar currently uses, so the
# binaries are interchangeable.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  build:
    # Build on pushes to main and on non-draft PR pushes; never on draft PRs.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # Pin to 24.04 to match Magnetar's ubuntu:24.04 wrapper build image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make g++

      - name: Build and package native wrappers (Release + Debug)
        run: ./build_and_package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-wrappers
          path: |
            dist/se1-native-wrappers.tar.gz
            dist/se2-native-wrappers.tar.gz
            dist/se1-native-wrappers.debug.tar.gz
            dist/se2-native-wrappers.debug.tar.gz
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "dist/se1-native-wrappers.tar.gz"
            "dist/se2-native-wrappers.tar.gz"
            "dist/se1-native-wrappers.debug.tar.gz"
            "dist/se2-native-wrappers.debug.tar.gz"
          )

          if [ "${{ github.event_name }}" = "push" ]; then
            # Push to main -> public, tagged, latest.
            tag="v1.0.${{ github.run_number }}"
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --latest \
              --target "${{ github.sha }}" \
              --title "Linux Native Wrappers $tag" \
              --notes "Automated build of the Linux native wrapper libraries from commit ${{ github.sha }}." \
              "${assets[@]}"
          else
            # Non-draft PR -> draft release: not public, not latest, and no git
            # tag is created until a maintainer publishes it. One draft is kept
            # per PR (a stable pr-<n> tag), refreshed on every push.
            tag="pr-${{ github.event.pull_request.number }}"
            gh release delete "$tag" \
              --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --draft \
              --title "Linux Native Wrappers (PR #${{ github.event.pull_request.number }})" \
              --notes "Draft build for PR #${{ github.event.pull_request.number }} (commit ${{ github.event.pull_request.head.sha }})." \
              "${assets[@]}"
          fi
